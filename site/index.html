    <link rel="stylesheet" type="text/css" href="global.css" />
    <title>Nihilium</title>
    <style>
      .main-flex {
        display: flex;
        flex-direction: row;
        height: 100%;
        gap: 1em;

        margin: 1em;
        justify-content: center;
        align-items: center;
      }

      /* Styles for image from gallery */
      .imageContainer {
        display: flex;
        align-self: flex-start;

        max-width: 90%;
        min-width: 0;
        min-height: 0;

        justify-content: center;
        align-items: center;
        flex-direction: column;

        outline-style: solid;
        outline-color: var(--tertiary-color);
        outline-width: 2px;
      }

      .image {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Sidebar & sidebar sections */
      .sidebar {
        display: flex;
        width: fit-content;
        flex-direction: column;
      }

      .sidebar .section .title {
        text-align: center;

        font-family: "Lato", sans-serif;
        font-size: 3em;
        font-weight: 999;
        font-style: italic;
        font-family: Arial, Helvetica, sans-serif;

        background: linear-gradient(0deg, #191919, #c0c0c0, #191919);
        background-clip: text;
        -webkit-background-clip: text; /* for Safari/older browsers */
        color: transparent;
        -webkit-text-fill-color: transparent; /* for Safari */
      }

      .sidebar .section .subtitle {
        text-align: center;
        font-weight: 700;
      }

      .sidebar .section .nav {
        display: flex;
        flex-direction: row;
        justify-content: center;

        gap: 0.5em;
      }

      .section .nav a {
        font-size: larger;
        font-variant: small-caps;

        color: var(--primary-color);
      }

      /* IP copy button styles */
      .java-btn,
      .bedrock-btn {
        padding: 0;
        width: 1.7em;
        padding: 0.1em;

        vertical-align: middle;

        background-color: transparent;
        border-style: hidden;
      }

      .java-btn:hover,
      .bedrock-btn:hover {
        background-color: var(--secondary-color);
      }

      /* Community */
      .community .links {
        display: flex;
        justify-content: center;
        gap: 1em;
      }

      .community .links a {
        height: fit-content;
      }

      .community .link-icon {
        display: inline-block;

        width: 2.5em;

        align-items: center;
      }
    </style>
  </head>

  <body>
    <div class="main" id="main">
      <div class="main-flex" id="main-flex">
        <div class="sidebar">
          <div class="section">
            <div class="title">NIHILIUM</div>
            <div class="nav">
              <a href="about.html">about us</a>
              <a href="gallery.html">gallery</a>
            </div>
            <div class="subtitle">The true survival anarchy experience</div>
          </div>
          <div class="section">
            <h1>connect</h1>
            <h2>Java</h2>
            <span class="code">nihilium.org</span>
            <button class="java-btn" id="java-btn">COPY</button>
            (1.9.x - 26.x)

            <h2>Bedrock</h2>
            <span class="code">bedrock.nihilium.org</span>
            <button class="bedrock-btn" id="bedrock-btn">COPY</button>
            <br />
            <span class="smallcaps">port</span>
            <span class="code">25406</span>
          </div>

          <div class="section community">
            <h1>join the community</h1>
            <div class="links">
              <a href="https://stt.gg/aevDzk2v">
                <img
                  class="link-icon"
                  src="https://nihiliummc.github.io/website/assets/stoat-toast.svg"
                />
              </a>
              <a href="https://dsc.gg/nihilium">
                <img
                  class="link-icon"
                  src="https://nihiliummc.github.io/website/assets/discord-clyde.svg"
                />
              </a>
            </div>
          </div>
          <div class="section">
            <img
              src="https://api.mcstatus.io/v2/widget/java/nihilium.org"
              style="height: 5.5em"
            />
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="footer.js"></script>
  <script src="makeCopyButton.js"></script>
  <script src="galleryImages.js"></script>
  <script>
    const copyIcon =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="rgb(253, 254, 255)" d="M480 400L288 400C279.2 400 272 392.8 272 384L272 128C272 119.2 279.2 112 288 112L421.5 112C425.7 112 429.8 113.7 432.8 116.7L491.3 175.2C494.3 178.2 496 182.3 496 186.5L496 384C496 392.8 488.8 400 480 400zM288 448L480 448C515.3 448 544 419.3 544 384L544 186.5C544 169.5 537.3 153.2 525.3 141.2L466.7 82.7C454.7 70.7 438.5 64 421.5 64L288 64C252.7 64 224 92.7 224 128L224 384C224 419.3 252.7 448 288 448zM160 192C124.7 192 96 220.7 96 256L96 512C96 547.3 124.7 576 160 576L352 576C387.3 576 416 547.3 416 512L416 496L368 496L368 512C368 520.8 360.8 528 352 528L160 528C151.2 528 144 520.8 144 512L144 256C144 247.2 151.2 240 160 240L176 240L176 192L160 192z"/></svg>';
    const checkmarkIcon =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path fill="rgb(99, 230, 190)" d="M530.8 134.1C545.1 144.5 548.3 164.5 537.9 178.8L281.9 530.8C276.4 538.4 267.9 543.1 258.5 543.9C249.1 544.7 240 541.2 233.4 534.6L105.4 406.6C92.9 394.1 92.9 373.8 105.4 361.3C117.9 348.8 138.2 348.8 150.7 361.3L252.2 462.8L486.2 141.1C496.6 126.8 516.6 123.6 530.9 134z"/></svg>';

    makeCopyButton("java-btn", "nihilium.org", copyIcon, checkmarkIcon);
    makeCopyButton(
      "bedrock-btn",
      "bedrock.nihilium.org",
      copyIcon,
      checkmarkIcon,
    );

    function random(x, y) {
      return Math.floor(Math.random() * (y - x + 1)) + x;
    }

    const imageContainer = document.getElementById("main-flex");
    const image = galleryImages[random(0, galleryImages.length - 1)];

    console.log(`Selected ${JSON.stringify(image)}`);

    if (imageContainer) {
      const imageLink = document.createElement("a");

      imageLink.classList.add("imageContainer");
      imageLink.href = image.path;

      const imageElement = document.createElement("img");
      imageElement.classList.add("image");
      imageElement.src = image.path;

      imageLink.append(imageElement);
      imageLink.target = "_blank";
      imageLink.innerHTML += image.description;

      imageContainer.append(imageLink);
    } else {
      console.error("Image container not found");
    }
  </script>
</html>
