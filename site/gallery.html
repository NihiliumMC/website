<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://nihiliummc.github.io/website/assets/favicon.ico"
    />
    <link rel="stylesheet" type="text/css" href="global.css" />
    
    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    
    <title>Gallery - nihilium.org</title>
    <style>
      .main {
        flex-direction: column !important;
        align-items: stretch;
      }

      .topbar {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15em, 1fr));
        gap: 2px;
      }

      .image {
        display: block;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div class="main" id="main">
      <div class="topbar">
        <div class="section centered-section">
          <a class="main-title" href="index.html">NIHILIUM</a>
          <div class="main-subtitle">Images from the server</div>
        </div>
      </div>
      <div class="gallery" id="gallery"></div>
    </div>
  </body>
  <script src="footer.js"></script>
  <script src="makeCopyButton.js"></script>
  <script src="galleryImages.js"></script>
  <script>
    const imageContainer = document.getElementById("gallery");

    if (imageContainer) {
      for (const image of galleryImages) {
        const imageLink = document.createElement("a");

        imageLink.classList.add("section");
        imageLink.classList.add("imageContainer");
        imageLink.href = image.path;

        const imageElement = document.createElement("img");
        imageElement.classList.add("image");
        imageElement.src = image.path;
        imageElement.alt = image.description;

        imageLink.append(imageElement);
        imageLink.target = "_blank";
        imageLink.innerHTML += image.description;

        imageContainer.append(imageLink);
      }
    } else {
      console.error("Image container not found");
    }
  </script>
</html>
